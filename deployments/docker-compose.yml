services:
  homectl:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: homectl
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-fake_token}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Guayaquil}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
