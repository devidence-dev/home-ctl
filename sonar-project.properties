# Project identification
# TODO: confirm sonar.projectKey in SonarCloud (Project Information) after importing the repo.
sonar.organization=devidence-dev
sonar.projectKey=devidence-dev_home-ctl
sonar.sourceEncoding=UTF-8

# Source and exclusion configuration (agent/spec tooling and docs are not product code)
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,data/**,**/*.md,docs/**,openspec/**,.agents/**,.claude/**,.specify/**,graphify-out/**

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Table-driven tests read better flat; complexity rule applies to production code only
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# Coverage (Go)
sonar.go.coverage.reportPaths=coverage.out

# Same scope as scripts/verify.sh coverage gate: cmd/ is wiring/entrypoint
sonar.coverage.exclusions=cmd/**

# Quality Gate - Wait for the result and fail if it does not pass
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
