name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: 🧪 CI
    uses: devidence-dev/workflows/.github/workflows/ci-go.yml@v1
    with:
      go_version_file: "go.mod"
      build_target: "./cmd/homectl"
    permissions:
      contents: read
      id-token: write # sonar job fetches SONAR_TOKEN from Infisical via OIDC
